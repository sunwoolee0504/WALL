name: CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated CPU environment
        run: bash scripts/install_optimized_env.sh cpu .venv-ci
      - name: Test without StarCraft II or checkpoints
        run: .venv-ci/bin/python -m pytest tests -q
      - name: Validate standalone source export
        run: |
          .venv-ci/bin/python scripts/prepare_github_release.py --destination "$RUNNER_TEMP/wall-source"
          cd "$RUNNER_TEMP/wall-source"
          "$GITHUB_WORKSPACE/.venv-ci/bin/python" -m pytest tests -q
